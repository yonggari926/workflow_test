name: PR 검증

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate-pr:
    name: PR 정책 검증
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: web.config 변경 확인
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          shopt -s nocasematch
          mapfile -t changed_files < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          web_configs=()

          for file in "${changed_files[@]}"; do
            if [[ "$file" =~ (^|/)web\.config$ ]]; then
              web_configs+=("$file")
              echo "::warning file=$file,title=web.config 변경 감지::$file 파일의 환경별 설정값과 비밀정보 포함 여부를 확인해주세요."
            fi
          done

          if (( ${#web_configs[@]} > 0 )); then
            {
              echo "### ⚠️ web.config 변경 감지"
              printf -- '- `%s`\n' "${web_configs[@]}"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          marker='<!-- web-config-warning -->'
          comments_endpoint="repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments"

          if ! existing_comment_id="$(
            gh api "$comments_endpoint?per_page=100" \
              --jq 'map(select(.user.login == "github-actions[bot]" and (.body | contains("<!-- web-config-warning -->")))) | first | .id // empty'
          )"; then
            echo "::warning title=PR 댓글 작성 실패::기존 PR 댓글을 확인하지 못했습니다."
            exit 0
          fi

          if (( ${#web_configs[@]} > 0 )); then
            body_file="$(mktemp)"
            payload_file="$(mktemp)"
            {
              echo "$marker"
              echo "## ⚠️ web.config 변경 감지"
              echo
              echo "다음 설정 파일이 변경되었습니다."
              echo
              printf -- '- `%s`\n' "${web_configs[@]}"
              echo
              echo "환경별 설정값, 연결 문자열 및 비밀정보 포함 여부를 확인해주세요."
            } > "$body_file"
            jq -Rs '{body: .}' "$body_file" > "$payload_file"

            if [[ -n "$existing_comment_id" ]]; then
              if ! gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing_comment_id" --input "$payload_file" > /dev/null; then
                echo "::warning title=PR 댓글 작성 실패::web.config 경고 댓글을 갱신하지 못했습니다."
              fi
            else
              if ! gh api --method POST "$comments_endpoint" --input "$payload_file" > /dev/null; then
                echo "::warning title=PR 댓글 작성 실패::web.config 경고 댓글을 작성하지 못했습니다."
              fi
            fi
          elif [[ -n "$existing_comment_id" ]]; then
            if ! gh api --method DELETE "repos/$GITHUB_REPOSITORY/issues/comments/$existing_comment_id" > /dev/null; then
              echo "::warning title=PR 댓글 작성 실패::더 이상 필요하지 않은 web.config 경고 댓글을 삭제하지 못했습니다."
            fi
          fi

      - name: PR 브랜치 방향 검증
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "$BASE_REF" == "develop" && "$HEAD_REF" =~ ^feature/.+ ]] ||
             [[ "$BASE_REF" == "main" && "$HEAD_REF" == "develop" ]] ||
             [[ "$BASE_REF" == "main" && "$HEAD_REF" =~ ^hotfix/.+ ]]; then
            echo "허용된 PR 방향: $HEAD_REF -> $BASE_REF"
            exit 0
          fi

          echo "::error title=허용되지 않은 PR 방향::$HEAD_REF -> $BASE_REF 방향은 허용되지 않습니다. 허용 방향: feature/* -> develop, develop -> main, hotfix/* -> main."
          exit 1

  build:
    name: .NET Framework 솔루션 빌드
    needs: validate-pr
    runs-on: windows-latest
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: MSBuild 설정
        uses: microsoft/setup-msbuild@v3

      - name: NuGet 설정
        uses: NuGet/setup-nuget@v3
        with:
          nuget-version: latest

      - name: 솔루션 파일 찾기
        shell: pwsh
        run: |
          $solutions = @(
            Get-ChildItem -Path $env:GITHUB_WORKSPACE -File |
              Where-Object { $_.Extension -in '.sln', '.slnx' } |
              Sort-Object @{ Expression = { if ($_.Extension -eq '.sln') { 0 } else { 1 } } }, Name
          )

          if ($solutions.Count -ne 1) {
            throw "Expected exactly one solution (.sln or .slnx) in the repository root, but found $($solutions.Count)."
          }

          "SOLUTION_PATH=$($solutions[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Solution: $($solutions[0].FullName)"

      - name: NuGet 패키지 복원
        shell: pwsh
        run: nuget restore "$env:SOLUTION_PATH" -NonInteractive

      - name: 솔루션 빌드
        shell: pwsh
        run: msbuild "$env:SOLUTION_PATH" /m /t:Build /p:Configuration=Debug '/p:Platform=Any CPU' /verbosity:minimal
